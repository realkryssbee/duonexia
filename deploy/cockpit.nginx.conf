# Cockpit — reverse proxy nginx (VPS)
#
# But : exposer l'API en HTTPS sur api.duonexia.be, en écoute uniquement sur
# le loopback (le port 4000 n'est JAMAIS ouvert publiquement).
#
# Prérequis DNS : api.duonexia.be -> IP du VPS (enregistrement A).
#
# Installation (Debian/Ubuntu) :
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/cockpit.nginx.conf /etc/nginx/sites-available/cockpit
#   sudo ln -s /etc/nginx/sites-available/cockpit /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo certbot --nginx -d api.duonexia.be      # active HTTPS + renouvellement auto
#
# Note : le serveur Fastify est démarré avec trustProxy (X-Forwarded-*) ;
# c'est notre propre proxy qui fournit ces en-têtes, rien d'autre.

server {
    listen 80;
    listen [::]:80;
    server_name api.duonexia.be;

    # Certbot transforme ce bloc en écoute 443 après sa première exécution.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookies de session : transmis tels quels (HttpOnly, SameSite=Lax).
        proxy_set_header Cookie             $http_cookie;

        proxy_read_timeout 60s;
        client_max_body_size 1m;   # API JSON légère en V1
    }
}
